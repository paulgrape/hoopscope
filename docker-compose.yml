# Local development: runs the NestJS backend in a container.
# The frontend deploys to Vercel and runs locally via `npm run dev -w apps/frontend`.
#
# Single instance only: the cache, replay sessions, and rate limiter all live in
# process memory, so scaling past one replica splits state. See README.
services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost:3001
    env_file:
      - path: apps/backend/.env
        required: false
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/live > /dev/null']
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped
