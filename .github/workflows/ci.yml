name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        working-directory: apps/backend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/backend

      - name: Unit tests
        run: npm run test:cov -w apps/backend

      - name: E2E tests
        run: npm run test:e2e -w apps/backend

      - name: Build
        run: npm run build -w apps/backend

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f apps/backend/Dockerfile -t hoopscope-backend:ci .

      - name: Verify runtime contents
        run: |
          docker run --rm hoopscope-backend:ci node -e "
            const fs = require('node:fs');
            fs.accessSync('dist/games/data/historic-games.json');
            for (const pkg of ['jest', 'typescript', '@nestjs/cli']) {
              if (fs.existsSync('node_modules/' + pkg)) {
                throw new Error('devDependency shipped in runtime image: ' + pkg);
              }
            }
          "

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/frontend

      - name: Tests
        run: npm run test:cov -w apps/frontend

      - name: Build
        run: npm run build -w apps/frontend

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
