name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        working-directory: apps/backend

      - name: Unit tests
        run: npm run test -w apps/backend

      - name: E2E tests
        run: npm run test:e2e -w apps/backend

      - name: Build
        run: npm run build -w apps/backend

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/frontend

      - name: Tests
        run: npm run test -w apps/frontend

      - name: Build
        run: npm run build -w apps/frontend
